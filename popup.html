<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Drops</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <p id="account" class="whoami"></p>
      <h1 id="title">Drops</h1>
    </div>
    <button id="gear" class="gear" type="button" aria-label="Settings" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button id="toggle" class="switch" type="button" aria-pressed="false" aria-label="Miner">
      <span class="knob"></span>
    </button>
  </header>

  <div id="settings" class="hidden">
    <section class="sheet">
      <div class="sheet-head"><h2 id="settings-title">Settings</h2></div>
      <div class="picker">
        <div class="row">
          <div class="row-text"><strong id="lang-label"></strong></div>
          <div class="langs" id="langs">
            <button type="button" data-lang="ru">RU</button>
            <button type="button" data-lang="en">EN</button>
          </div>
        </div>
        <div class="row">
          <div class="row-text"><strong id="twitch-label"></strong></div>
          <button id="twitch-toggle" class="switch" type="button" aria-pressed="false" aria-label="Twitch"><span class="knob"></span></button>
        </div>
        <div class="row">
          <div class="row-text"><strong id="kick-label"></strong></div>
          <button id="kick-toggle" class="switch" type="button" aria-pressed="false" aria-label="Kick"><span class="knob"></span></button>
        </div>
        <div class="row">
          <div class="row-text"><strong id="auto-title"></strong><small id="auto-hint"></small></div>
          <button id="auto" class="switch" type="button" aria-pressed="false" aria-label="Auto"><span class="knob"></span></button>
        </div>
        <div class="row">
          <div class="row-text"><strong id="reward-choice-label"></strong><small id="reward-choice-hint"></small></div>
          <button id="reward-choice" class="switch" type="button" aria-pressed="false" aria-label="Reward choice"><span class="knob"></span></button>
        </div>
        <div class="row solo-row">
          <div class="row-text"><strong id="solo-twitch-label"></strong><small id="solo-twitch-hint"></small></div>
          <button id="solo-twitch-pick" class="solo-pick" type="button" aria-expanded="false"><img id="solo-twitch-art" class="solo-art hidden" alt=""><span id="solo-twitch-value"></span></button>
        </div>
        <div class="solo-find hidden" id="solo-twitch-find">
          <label class="search"><input id="solo-twitch-filter" type="search" placeholder="Search game" autocomplete="off"></label>
          <div id="solo-twitch-list" class="solo-list"></div>
        </div>
        <div class="row solo-row">
          <div class="row-text"><strong id="solo-kick-label"></strong><small id="solo-kick-hint"></small></div>
          <button id="solo-kick-pick" class="solo-pick" type="button" aria-expanded="false"><img id="solo-kick-art" class="solo-art hidden" alt=""><span id="solo-kick-value"></span></button>
        </div>
        <div class="solo-find hidden" id="solo-kick-find">
          <label class="search"><input id="solo-kick-filter" type="search" placeholder="Search game" autocomplete="off"></label>
          <div id="solo-kick-list" class="solo-list"></div>
        </div>
        <div class="row">
          <div class="row-text"><strong id="cases-toggle-label"></strong><small id="cases-toggle-hint"></small></div>
          <button id="cases-toggle" class="switch" type="button" aria-pressed="true" aria-label="Cases"><span class="knob"></span></button>
        </div>
        <div class="row hidden" id="points-row">
          <div class="row-text"><strong id="points-label"></strong><small id="points-toggle-hint"></small></div>
          <button id="points-toggle" class="switch" type="button" aria-pressed="false" aria-label="Points"><span class="knob"></span></button>
        </div>
        <button id="inventory-2" class="row link" type="button"></button>
      </div>
    </section>
    <section id="accounts" class="sheet">
      <div class="sheet-head"><h2 id="accounts-title"></h2></div>
      <p id="accounts-hint" class="hint"></p>
      <p id="accounts-adding" class="status wait hidden"></p>
      <div id="accounts-confirm" class="picker confirm hidden">
        <p id="accounts-confirm-text"></p>
        <div class="confirm-actions">
          <button id="accounts-confirm-no" type="button"></button>
          <button id="accounts-confirm-yes" type="button" class="primary"></button>
        </div>
      </div>
      <div class="picker">
        <div id="accounts-list"></div>
        <button id="add-twitch" class="row link plus" type="button"></button>
        <button id="add-kick" class="row link plus" type="button"></button>
        <div class="row rotate">
          <div class="row-text"><strong id="rotate-title"></strong><small id="rotate-hint"></small></div>
          <select id="rotate-mode"></select>
          <input id="rotate-limit" type="number" min="1" max="50" step="1">
        </div>
        <div id="home-rows"></div>
      </div>
    </section>
    <section id="black" class="sheet">
      <div class="sheet-head"><h2 id="black-title"></h2><span id="black-count"></span></div>
      <p id="black-hint" class="hint"></p>
      <div class="picker">
        <label class="search"><input id="black-filter" type="search" autocomplete="off"></label>
        <div id="black-list"></div>
      </div>
    </section>
  </div>

  <div id="main">
  <div id="duo" class="duo">
    <section id="watch" class="hero"></section>
    <section id="kick-watch" class="hero"></section>
  </div>
  <div id="duo-more" class="duo hidden"></div>

  <nav id="tabs" class="tabs">
    <button type="button" data-tab="twitch"><span>Twitch</span> <em id="tab-twitch-n"></em></button>
    <button type="button" data-tab="kick"><span>Kick</span> <em id="tab-kick-n"></em></button>
    <button type="button" data-tab="points" class="hidden"><span id="tab-points-label">Points</span> <em id="tab-points-n"></em></button>
    <button type="button" data-tab="games"><span id="tab-games-label">Games</span> <em id="tab-games-n"></em></button>
    <button type="button" data-tab="history"><span id="tab-history-label">History</span></button>
  </nav>

  <div id="panel-twitch" class="panel">
    <div id="twitch-accounts" class="acc-rows"></div>
    <p id="status" class="status"></p>
    <p id="reward-note" class="status note hidden"><span id="reward-note-text"></span> <button id="reward-note-open" type="button" class="link-btn"></button></p>
    <section class="sheet">
      <div class="sheet-head"><h2 id="farm-title">Farming</h2></div>
      <div id="queue"></div>
    </section>
  </div>

  <div id="panel-kick" class="panel hidden">
    <div id="kick-accounts" class="acc-rows"></div>
    <p id="kick-status" class="status"></p>
    <div id="kick-list"></div>
    <section class="sheet" id="cases">
      <div class="sheet-head"><h2 id="cases-title"></h2><span id="cases-count"></span></div>
      <p id="cases-hint" class="hint"></p>
      <div class="picker"><div id="cases-list"></div></div>
    </section>
  </div>

  <div id="panel-points" class="panel hidden">
    <div class="langs sides" id="points-sides">
      <button type="button" data-side="twitch">Twitch</button>
      <button type="button" data-side="kick">Kick</button>
    </div>
    <div id="points-accounts" class="acc-rows"></div>
    <section class="sheet">
      <div class="sheet-head"><h2 id="points-title"></h2><span id="points-count"></span></div>
      <p id="points-hint" class="hint"></p>
      <p id="points-off" class="status wait hidden"></p>
      <div class="picker">
        <label class="search"><input id="points-filter" type="search" autocomplete="off"></label>
        <div id="points-results"></div>
        <div id="points-list"></div>
      </div>
    </section>
  </div>

  <div id="panel-history" class="panel hidden">
    <section class="sheet">
      <div class="sheet-head"><h2 id="history-title"></h2><button id="history-clear" class="mini" type="button"></button></div>
      <div class="picker"><div id="history-list"></div></div>
    </section>
  </div>

  <div id="panel-games" class="panel hidden">
    <section class="sheet">
      <div class="sheet-head">
        <h2 id="games-title">Games</h2>
        <span id="game-count"></span>
      </div>
      <p id="games-hint" class="hint"></p>
      <div id="games-accounts" class="acc-rows"></div>
      <div class="picker">
        <label class="search"><input id="filter" type="search" placeholder="Add a game" autocomplete="off"></label>
        <div id="games"></div>
      </div>
    </section>
  </div>

  <details class="sheet log-sheet">
    <summary id="log-title">Log</summary>
    <ol id="log"></ol>
  </details>
  </div>

  <footer>
    <button id="now" type="button">Refresh</button>
    <button id="extra" class="hidden" type="button">Open</button>
    <button id="kick-login" class="hidden" type="button"></button>
    <button id="kick-extra" class="hidden" type="button"></button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
